<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<title>Gugu Browser · LaswI ID 登录</title>
<style>
  :root{
    --brand:#4D8BE6;
    --brand-deep:#2F6BC4;
    --bg:#F5F7FB;
    --card:#FFFFFF;
    --text:#12161F;
    --sub:#6B7280;
    --line:#E5E9F0;
    --danger:#D93A3A;
    --ok:#1E9E6A;
    --radius:18px;
    --shadow:0 18px 48px rgba(18,22,31,.10), 0 2px 8px rgba(18,22,31,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1116; --card:#171B22; --text:#EDEFF3; --sub:#9AA3B2; --line:#262B34;
      --shadow:0 18px 48px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    line-height:1.5;
  }
  .stage{width:100%;max-width:420px}
  .brandtop{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
  .glogo{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,var(--brand),var(--brand-deep));
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;
    letter-spacing:-.5px;
  }
  .brandtop .wm{font-weight:700;font-size:15px;letter-spacing:.2px}
  .brandtop .wm span{color:var(--sub);font-weight:500}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:26px 24px 22px;
  }

  /* 软件信息区 */
  .appinfo{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .applogo{
    width:56px;height:56px;border-radius:14px;flex:none;overflow:hidden;
    background:linear-gradient(145deg,var(--brand),var(--brand-deep));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;
  }
  .applogo img{width:100%;height:100%;object-fit:cover;display:block}
  .appmeta{min-width:0}
  .appmeta h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appmeta p{margin:3px 0 0;font-size:12.5px;color:var(--sub)}
  .skeleton{background:var(--line);border-radius:6px;color:transparent!important;user-select:none}

  .terms{font-size:13px;color:var(--sub);margin:18px 0 0}
  .terms b{color:var(--text);font-weight:600}
  .callback{
    display:flex;align-items:center;gap:8px;margin-top:10px;
    background:rgba(77,139,230,.09);border:1px solid rgba(77,139,230,.22);
    border-radius:10px;padding:9px 11px;font-size:12px;color:var(--brand-deep);
    word-break:break-all;
  }
  @media (prefers-color-scheme: dark){.callback{color:#9CC2F5}}
  .callback svg{flex:none}

  /* 表单 */
  form{margin-top:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:500}
  .inputwrap{position:relative;display:flex;align-items:center}
  input[type=email],input[type=password],input[type=text]{
    width:100%;height:46px;padding:0 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;
    font-family:inherit;
  }
  input::placeholder{color:#A6AEB9}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(77,139,230,.16);background:var(--card)}
  input:disabled{opacity:.6}
  .peek{
    position:absolute;right:6px;height:34px;padding:0 10px;border:0;background:transparent;
    color:var(--sub);font-size:12.5px;cursor:pointer;border-radius:8px;
  }
  .peek:hover{color:var(--text)}

  .btn{
    width:100%;height:48px;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(145deg,var(--brand),var(--brand-deep));color:#fff;
    font-size:15px;font-weight:600;letter-spacing:.3px;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s,filter .15s;
    margin-top:4px;
  }
  .btn:active{transform:scale(.988)}
  .btn:disabled{filter:grayscale(.35) brightness(.95);cursor:default}
  .spinner{
    width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;animation:spin .7s linear infinite;display:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .altline{margin-top:16px;text-align:center;font-size:12.5px;color:var(--sub)}
  .altline a{color:var(--brand);text-decoration:none;font-weight:500}

  .msg{
    display:none;margin-top:14px;padding:11px 13px;border-radius:11px;
    font-size:13px;line-height:1.45;
  }
  .msg.show{display:block}
  .msg.err{background:rgba(217,58,58,.10);border:1px solid rgba(217,58,58,.25);color:var(--danger)}
  .msg.warn{background:rgba(219,150,20,.10);border:1px solid rgba(219,150,20,.28);color:#B07807}
  .msg.ok{background:rgba(30,158,106,.10);border:1px solid rgba(30,158,106,.25);color:var(--ok)}

  .foot{margin-top:20px;text-align:center;font-size:11.5px;color:var(--sub);line-height:1.7}
  .foot b{font-weight:600;color:var(--text)}
  .foot .dot{opacity:.45;margin:0 6px}

  /* 居中状态页 */
  .center{text-align:center;padding:16px 0 6px}
  .center .big{font-size:15px;font-weight:600;margin:14px 0 6px}
  .center p{margin:0;font-size:13px;color:var(--sub)}
  .ring{
    width:42px;height:42px;margin:0 auto;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;
  }
  .ticon{width:46px;height:46px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:22px}

  /* TOTP 模态 */
  .mask{
    position:fixed;inset:0;background:rgba(10,13,18,.5);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .mask.show{display:flex}
  .modal{
    width:100%;max-width:360px;background:var(--card);border-radius:16px;padding:22px;
    box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .modal h3{margin:0 0 6px;font-size:16px}
  .modal p{margin:0 0 14px;font-size:13px;color:var(--sub)}
  .modal input{text-align:center;letter-spacing:6px;font-size:19px;font-weight:600;height:52px}
  .modal .row{display:flex;gap:10px;margin-top:6px}
  .modal .row .btn{margin-top:0}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:500}
  .btn.ghost:hover{color:var(--text)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="stage">
  <div class="brandtop">
    <div class="glogo">G</div>
    <div class="wm">Gugu Browser <span>× LaswI ID</span></div>
  </div>

  <div class="card">
    <!-- 1. 校验登录key中 -->
    <section id="viewLoading" class="center">
      <div class="ring"></div>
      <div class="big">正在校验登录请求</div>
      <p>请稍候…</p>
    </section>

    <!-- 2. 登录表单 -->
    <section id="viewForm" hidden>
      <div class="appinfo">
        <div class="applogo" id="appLogo">G</div>
        <div class="appmeta">
          <h1 id="appName">Gugu Browser</h1>
          <p id="appDev">LaswI Studio</p>
        </div>
      </div>

      <p class="terms">使用你的 <b>LaswI ID</b> 登录，授权后自动返回应用。</p>
      <div class="callback" id="callbackHint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="callbackText">完成后将返回应用</span>
      </div>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="field">
          <label for="email">LaswI ID 邮箱</label>
          <div class="inputwrap">
            <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="inputwrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required />
            <button class="peek" type="button" id="peekBtn" aria-label="显示密码">显示</button>
          </div>
        </div>
        <button class="btn" id="loginBtn" type="submit">
          <span class="spinner" id="spinner"></span><span id="btnText">登录并授权</span>
        </button>
      </form>

      <div class="msg" id="msg" role="alert"></div>
      <div class="altline">还没有 LaswI ID？<a href="#" id="registerLink" rel="noopener">前往注册</a></div>
    </section>

    <!-- 3. 失败 -->
    <section id="viewError" class="center" hidden>
      <div class="ticon" style="background:rgba(217,58,58,.12);color:var(--danger)">!</div>
      <div class="big" id="errTitle">登录未完成</div>
      <p id="errDesc">请返回应用重试。</p>
    </section>

    <!-- 4. 成功跳转 -->
    <section id="viewDone" class="center" hidden>
      <div class="ticon" style="background:rgba(30,158,106,.12);color:var(--ok)">✓</div>
      <div class="big">授权成功</div>
      <p id="doneDesc">正在返回 Gugu Browser…</p>
    </section>
  </div>

  <div class="foot">
    身份服务由 <b>LaswI ID</b> 提供<span class="dot">·</span>页面由 <b>LaswI Studio</b> 部署<br />
    <span id="footDomain"></span>
  </div>
</div>

<!-- TOTP -->
<div class="mask" id="totpMask">
  <div class="modal">
    <h3>双重验证</h3>
    <p>该账号已开启 TOTP，请输入身份验证器中的 6 位动态码，或使用备用码。</p>
    <input id="totpInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="10" />
    <div class="msg err" id="totpMsg"></div>
    <div class="row">
      <button class="btn ghost" id="totpCancel" type="button">取消</button>
      <button class="btn" id="totpOk" type="button">验证</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
   * 配置
   * 默认走 LaswI ID 官方 API；若该域名未在平台 CORS 白名单内，
   * 可用 ?api=https://<your-proxy>/api 指向自建转发（见 proxy/worker.js）。
   * ------------------------------------------------------------------ */
  var API_PRIMARY = "https://rtuser.rtstudio.top/api";
  var API_BACKUP  = "https://rtuser.242524.xyz/api";

  var qs = new URLSearchParams(location.search);
  var CFG = {
    port: qs.get("port") || "",
    type: qs.get("type") || "loginkey",
    v: qs.get("v") || "",
    state: qs.get("state") || "",
    env: qs.get("env") || "app",
    api: qs.get("api") || window.__LASWI_API__ || API_PRIMARY
  };

  var $ = function (id) { return document.getElementById(id); };
  var softwareInfo = {};
  var submitting = false;

  /* ---------------------------- 工具 ---------------------------- */

  function show(view) {
    ["viewLoading", "viewForm", "viewError", "viewDone"].forEach(function (id) {
      $(id).hidden = (id !== view);
    });
  }

  function setMsg(text, kind) {
    var el = $("msg");
    if (!text) { el.className = "msg"; el.textContent = ""; return; }
    el.textContent = text;
    el.className = "msg show " + (kind || "err");
  }

  function callbackTarget() {
    if (!CFG.port) return "";
    if (CFG.env === "web") return "https://" + CFG.port + "/";
    return "http://127.0.0.1:" + CFG.port + "/";
  }

  function redirect(type, value) {
    var base = callbackTarget();
    if (!base) { fail("缺少回调参数", "登录请求不完整（missing port），请从应用内重新发起登录。"); return; }
    var url = base + "?type=" + encodeURIComponent(type) +
              "&v=" + encodeURIComponent(value || "") +
              "&state=" + encodeURIComponent(CFG.state);
    window.location.replace(url);
  }

  function fail(title, desc) {
    $("errTitle").textContent = title;
    $("errDesc").textContent = desc || "请返回应用重试。";
    show("viewError");
  }

  /* --------------------------- API 层 --------------------------- */

  function request(path, body) {
    return fetch(CFG.api + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  // 区分「网络/CORS 阻断」与「业务失败」，避免把白名单问题误报为密码错误
  function callApi(path, body) {
    return request(path, body).catch(function () {
      if (CFG.api === API_PRIMARY) {
        CFG.api = API_BACKUP;
        return request(path, body).catch(function () { return null; });
      }
      return null;
    });
  }

  /* ------------------------- 1. 校验软件 ------------------------- */

  function verifySoftware() {
    if (CFG.type === "token") {
      return callApi("/auth/verify-software-token", { token: CFG.v }).then(function (res) {
        if (!res || !res.success) throw { code: "Invalid_token" };
        return {
          token: CFG.v,
          name: res.data.name,
          developer: res.data.developer,
          logoUrl: res.data.logoUrl || res.data.logo_url || null
        };
      });
    }
    if (CFG.type === "name") {
      return Promise.resolve({ name: CFG.v || "未知软件", developer: "未知开发者" });
    }
    // 默认 loginkey
    return callApi("/auth/verify-login-key", { login_key: CFG.v }).then(function (res) {
      if (res === null) throw { code: "Network" };
      if (!res.success) throw { code: "Invalid_login_key" };
      return {
        token: res.data.token,
        name: res.data.name,
        developer: res.data.developer,
        logoUrl: res.data.logoUrl || res.data.logo_url || null,
        login_key: CFG.v
      };
    });
  }

  function paintApp(info) {
    $("appName").textContent = info.name || "应用";
    $("appDev").textContent = info.developer ? "开发者：" + info.developer : "";
    $("appName").classList.remove("skeleton");
    $("appDev").classList.remove("skeleton");
    if (info.logoUrl) {
      var img = new Image();
      img.alt = "";
      img.onload = function () { $("appLogo").textContent = ""; $("appLogo").appendChild(img); };
      img.src = info.logoUrl;
    } else if (info.name) {
      $("appLogo").textContent = info.name.trim().charAt(0).toUpperCase();
    }
    var target = callbackTarget();
    $("callbackText").textContent = target
      ? "完成后返回 " + target.replace(/^https?:\/\//, "").replace(/\/$/, "")
      : "完成后返回应用";
  }

  /* --------------------------- 2. 登录 --------------------------- */

  function doLogin(email, password, totpCode) {
    var body = { email: email, password: password };
    if (softwareInfo.token) body.token = softwareInfo.token;
    if (softwareInfo.name) body.name = softwareInfo.name;
    if (softwareInfo.developer) body.developer = softwareInfo.developer;
    if (softwareInfo.logoUrl) body.logoUrl = softwareInfo.logoUrl;
    if (softwareInfo.login_key) body.login_key = softwareInfo.login_key;
    if (totpCode) body.totp_code = totpCode;
    return callApi("/auth/software-login", body);
  }

  function busy(on) {
    submitting = on;
    $("loginBtn").disabled = on;
    $("spinner").style.display = on ? "block" : "none";
    $("btnText").textContent = on ? "登录中…" : "登录并授权";
    $("email").disabled = on;
    $("password").disabled = on;
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (submitting) return;

    var email = $("email").value.trim();
    var password = $("password").value;
    setMsg("");

    if (!email) { setMsg("请输入 LaswI ID 邮箱"); $("email").focus(); return; }
    if (!password) { setMsg("请输入密码"); $("password").focus(); return; }

    busy(true);
    doLogin(email, password, null).then(function (res) {
      if (!res) {
        busy(false);
        setMsg("无法连接 LaswI ID 服务。该域名可能尚未加入平台访问白名单，请稍后重试或联系管理员。", "warn");
        return;
      }
      if (res.success) { onSuccess(res); return; }
      if (res.requireTotp) { busy(false); askTotp(email, password); return; }
      busy(false);
      setMsg(res.message || "登录失败，请检查邮箱与密码", "err");
    }).catch(function () {
      busy(false);
      setMsg("网络异常，请稍后重试", "err");
    });
  });

  function onSuccess(res) {
    show("viewDone");
    $("doneDesc").textContent = "正在返回应用…";
    var data = res.data || {};
    if (data.auth_code) redirect("code", data.auth_code);
    else if (data.token) redirect("success", data.token);
    else fail("登录响应异常", "未获取到授权凭据，请返回应用重试。");
  }

  /* --------------------------- TOTP --------------------------- */

  var totpCtx = null;

  function askTotp(email, password) {
    totpCtx = { email: email, password: password };
    $("totpInput").value = "";
    $("totpMsg").className = "msg err";
    $("totpInput").disabled = false;
    $("totpOk").disabled = false;
    $("totpMask").classList.add("show");
    setTimeout(function () { $("totpInput").focus(); }, 60);
  }

  function closeTotp() {
    $("totpMask").classList.remove("show");
    totpCtx = null;
  }

  $("totpCancel").addEventListener("click", closeTotp);

  $("totpOk").addEventListener("click", function () {
    if (!totpCtx) return;
    var code = $("totpInput").value.replace(/\s+/g, "");
    if (!code) { $("totpMsg").textContent = "请输入动态码或备用码"; $("totpMsg").className = "msg err show"; return; }

    $("totpOk").disabled = true;
    $("totpInput").disabled = true;
    doLogin(totpCtx.email, totpCtx.password, code).then(function (res) {
      $("totpOk").disabled = false;
      $("totpInput").disabled = false;
      if (!res) { $("totpMsg").textContent = "网络异常，请重试"; $("totpMsg").className = "msg err show"; return; }
      if (res.success) { closeTotp(); onSuccess(res); return; }
      if (res.locked) { closeTotp(); setMsg(res.message || "尝试次数过多，请稍后再试", "err"); return; }
      $("totpMsg").textContent = res.message || "动态码不正确";
      $("totpMsg").className = "msg err show";
      $("totpInput").value = "";
      $("totpInput").focus();
    });
  });

  $("totpInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); $("totpOk").click(); }
  });

  /* --------------------------- 交互细节 --------------------------- */

  $("peekBtn").addEventListener("click", function () {
    var p = $("password");
    var toText = p.type === "password";
    p.type = toText ? "text" : "password";
    this.textContent = toText ? "隐藏" : "显示";
  });

  $("registerLink").addEventListener("click", function (e) {
    e.preventDefault();
    var p = new URLSearchParams();
    if (CFG.port) p.set("port", CFG.port);
    if (CFG.type) p.set("type", CFG.type);
    if (CFG.v) p.set("v", CFG.v);
    if (CFG.state) p.set("state", CFG.state);
    if (CFG.env) p.set("env", CFG.env);
    var base = (window.__LASWI_LOGIN_BASE__ || "https://apilogin.rtstudio.top/") + "register.html";
    window.location.href = base + (p.toString() ? "?" + p.toString() : "");
  });

  /* ----------------------------- 启动 ----------------------------- */

  (function boot() {
    $("appName").textContent = "正在识别应用";
    $("appDev").textContent = " ";
    $("appName").className = "skeleton";
    $("appDev").className = "skeleton";
    var dom = location.hostname;
    $("footDomain").textContent = dom ? dom : "";

    if (!CFG.port) {
      fail("缺少登录参数", "请从 Gugu Browser 内点击「登录」重新发起。");
      return;
    }
    if (!CFG.v && CFG.type !== "name") {
      fail("登录请求无效", "缺少软件标识，请从应用内重新发起登录。");
      return;
    }

    show("viewLoading");
    verifySoftware().then(function (info) {
      softwareInfo = info;
      paintApp(info);
      show("viewForm");
      setTimeout(function () { $("email").focus(); }, 80);
    }).catch(function (err) {
      var map = {
        Invalid_login_key: ["登录请求已失效", "该登录链接已过期或被使用过。请回到 Gugu Browser 重新点击登录。"],
        Invalid_token: ["应用校验失败", "应用凭据无效，请联系应用开发者。"],
        Network: ["无法连接身份服务", "该域名可能尚未加入 LaswI ID 访问白名单。请联系管理员或在代理地址下访问。"]
      };
      var m = map[err && err.code] || map.Network;
      fail(m[0], m[1]);
    });
  })();
})();
</script>
</body>
</html>
