<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gugu Browser</title>
<meta name="description" content="Gugu Browser —— 多端同 UI 浏览器，由 LaswI Studio 出品。" />
<style>
  :root{--brand:#4D8BE6;--brand-deep:#2F6BC4;--bg:#F5F7FB;--card:#fff;--text:#12161F;--sub:#6B7280;--line:#E5E9F0}
  @media (prefers-color-scheme:dark){:root{--bg:#0E1116;--card:#171B22;--text:#EDEFF3;--sub:#9AA3B2;--line:#262B34}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",system-ui,sans-serif;line-height:1.6}
  .wrap{width:100%;max-width:440px;text-align:center}
  .logo{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;
    background:linear-gradient(145deg,var(--brand),var(--brand-deep));color:#fff;
    display:grid;place-items:center;font-size:32px;font-weight:800;
    box-shadow:0 12px 30px rgba(77,139,230,.30)}
  h1{margin:0 0 8px;font-size:24px;letter-spacing:-.4px}
  p{margin:0 0 26px;color:var(--sub);font-size:14.5px}
  a.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 26px;
    border-radius:12px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));
    color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    box-shadow:0 8px 22px rgba(77,139,230,.28)}
  a.btn:active{transform:scale(.99)}
  .note{margin-top:26px;font-size:12px;color:var(--sub);line-height:1.8}
  .note b{color:var(--text);font-weight:600}
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo">G</div>
    <h1>Gugu Browser</h1>
    <p>多端同 UI 浏览器 · LaswI ID 统一身份</p>
    <a class="btn" href="./id/">进入登录</a>
    <div class="note">
      本页仅供 <b>Gugu Browser</b> 登录授权使用<br />
      © 2026 LaswI Studio
    </div>
  </main>
</body>
</html>
